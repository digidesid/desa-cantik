<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Profil Desa Nanga Tayap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #938c03;
            --primary-soft: #d9d02f;
            --ink: #4a4708;
            --muted: #83801f;
            --border: #f0ecaa;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #ffffff;
            color: var(--ink);
            min-height: 100vh;
            padding: 60px 20px;
        }

        .page {
            max-width: 760px;
            margin: 0 auto;
        }

        .card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 44px 40px;
            box-shadow: 0 10px 30px rgba(147, 140, 3, 0.08);
        }

        .eyebrow {
            text-align: center;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .subtitle {
            text-align: center;
            font-size: 1rem;
            color: var(--muted);
            max-width: 480px;
            margin: 0 auto 36px;
            line-height: 1.6;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #111;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 40px 0 24px;
        }

        .footer-note {
            text-align: center;
            font-size: 0.82rem;
            color: var(--muted);
        }

        .logo {
            display: block;
            width: 56px;
            height: 56px;
            margin: 0 auto 18px;
            object-fit: contain;
        }

        @media (max-width: 600px) {
            body {
                padding: 36px 16px;
            }

            .card {
                padding: 30px 22px;
            }

            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="card">
            <img class="logo" src="https://cdn.digitaldesa.com/uploads/profil/61.04.11.2001/common/300_ketapangkab.png" alt="Logo Desa Nanga Tayap">
            <p class="eyebrow">Profil Desa</p>
            <h1>Video Profil Desa Nanga Tayap</h1>
            <p class="subtitle">Mengenal lebih dekat potensi, budaya, dan kehidupan masyarakat Desa Nanga Tayap, Kecamatan Nanga Tayap, Kabupaten Ketapang.</p>

            <div class="video-wrapper">
                <iframe
                    src="https://drive.google.com/file/d/1IaG9cxevCL0CBA8HMxeYPFp2K94k8YA3/preview"
                    allow="autoplay; fullscreen"
                    allowfullscreen
                    title="Video Profil Desa"
                ></iframe>
            </div>

            <div class="divider"></div>
            <p class="footer-note">Pemerintah Desa Nanga Tayap &middot; Kecamatan Nanga Tayap, Kabupaten Ketapang</p>
        </div>
    </div>
</body>
</html>
